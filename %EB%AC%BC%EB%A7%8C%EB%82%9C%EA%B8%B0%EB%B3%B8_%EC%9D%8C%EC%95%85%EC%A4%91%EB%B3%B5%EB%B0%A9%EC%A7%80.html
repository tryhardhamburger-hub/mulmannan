<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>물만난 기본</title>
  <style>
    :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select:none; touch-action:manipulation; }
    body { position:relative; background: radial-gradient(circle at 18% 12%, rgba(255,255,255,.18), transparent 10%), radial-gradient(circle at 82% 16%, rgba(255,255,255,.12), transparent 8%), linear-gradient(180deg, #2a6fd1 0%, #1d5fba 42%, #1953a8 100%); }
    body::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.35; background-image: radial-gradient(circle at 15% 25%, rgba(255,255,255,.9) 0 1px, transparent 1.5px), radial-gradient(circle at 80% 18%, rgba(255,255,255,.85) 0 1px, transparent 1.5px), radial-gradient(circle at 26% 78%, rgba(255,255,255,.9) 0 2px, transparent 3px), radial-gradient(circle at 75% 30%, rgba(255,255,255,.7) 0 4px, transparent 7px), radial-gradient(circle at 82% 7%, rgba(255,255,255,.4) 0 5px, transparent 8px); background-size: 170px 170px, 200px 200px, auto, auto, auto; background-repeat: repeat; }
    .wave1, .wave2 { position:absolute; left:-5%; width:110%; pointer-events:none; border-radius:45% 55% 0 0; }
    .wave1 { bottom:-5vh; height:14vh; background:#63dcf3; clip-path: polygon(0 72%, 8% 61%, 15% 73%, 24% 58%, 34% 74%, 41% 62%, 49% 76%, 59% 60%, 68% 75%, 77% 61%, 86% 74%, 94% 63%, 100% 70%, 100% 100%, 0 100%); }
    .wave2 { bottom:-1vh; height:10vh; background:rgba(255,255,255,.16); filter:blur(2px); clip-path: polygon(0 70%, 10% 60%, 18% 71%, 26% 59%, 35% 73%, 45% 61%, 55% 75%, 64% 62%, 74% 72%, 84% 60%, 94% 70%, 100% 64%, 100% 100%, 0 100%); }
    .game { position:relative; z-index:1; width:100%; height:100dvh; padding: calc(var(--safe-top) + 20px) 18px calc(var(--safe-bottom) + 18px); display:flex; flex-direction:column; align-items:center; justify-content:space-between; }
    .hud { text-align:center; }
    .title { color:#fff; font-size:clamp(26px, 6.3vw, 36px); font-weight:900; letter-spacing:-0.05em; text-shadow:0 4px 12px rgba(0,0,0,.18); margin-bottom:10px; }
    .count { display:inline-block; min-width:150px; padding:11px 18px; border-radius:999px; background:rgba(255,255,255,.92); color:#135cae; font-size:clamp(18px, 5vw, 25px); font-weight:800; box-shadow:0 10px 24px rgba(0,0,0,.12); }
    .stage { position:relative; flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding-bottom:9vh; }
    .character { position:relative; width:min(92vw, 430px); aspect-ratio:600 / 750; transform-origin:50% 76%; animation:idleRock 2.8s ease-in-out infinite; will-change:transform; }
    .character img { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
    .body-layer { transform-origin:54% 70%; animation:idleBody 2.8s ease-in-out infinite; }
    .head-motion {position:absolute;inset:0;width:100%;height:100%;transform-origin:42% 51%; animation:idleHead 2.8s ease-in-out infinite;}
    .shadow { position:absolute; width:42%; height:7%; left:28%; bottom:13%; border-radius:50%; background:rgba(8,61,119,.2); filter:blur(8px); animation:shadowBob 2.8s ease-in-out infinite; z-index:0; }
    .tap-effect { position:absolute; inset:0; pointer-events:none; }
    .splash { position:absolute; width:14px; height:14px; border-radius:50%; border:3px solid rgba(255,255,255,.75); opacity:0; animation:splash .5s ease-out forwards; }
    .hint { text-align:center; color:rgba(255,255,255,.96); font-size:clamp(13px, 3.6vw, 16px); font-weight:700; line-height:1.45; text-shadow:0 2px 8px rgba(0,0,0,.18); }
    .character.is-jumping { animation:tapJump .5s cubic-bezier(.25,.9,.2,1) 1; }
    .character.is-jumping .body-layer { animation:tapBody .5s cubic-bezier(.25,.9,.2,1) 1; }
    .character.is-jumping .head-motion { animation:tapHead .5s cubic-bezier(.25,.9,.2,1) 1; }
    .character.is-jumping .shadow { animation:tapShadow .5s cubic-bezier(.25,.9,.2,1) 1; }
    @keyframes idleRock { 0%,50%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-2px) rotate(4deg); } 75% { transform: translateY(-2px) rotate(-4deg); } }
    @keyframes idleBody { 0%,50%,100% { transform: rotate(0deg); } 25% { transform: rotate(2deg); } 75% { transform: rotate(-2deg); } }
    @keyframes idleHead { 0%,50%,100% { transform: rotate(0deg); } 25% { transform: rotate(7deg); } 75% { transform: rotate(-7deg); } }
    @keyframes shadowBob { 0%,50%,100% { transform: scaleX(1); opacity:.18; } 25%,75% { transform: scaleX(.94); opacity:.12; } }
    @keyframes tapJump { 0% { transform: translateY(0) scaleX(1) scaleY(1); } 18% { transform: translateY(8px) scaleX(1.08) scaleY(.86); } 48% { transform: translateY(-26px) scaleX(.92) scaleY(1.08); } 70% { transform: translateY(-8px) scaleX(1.01) scaleY(.98); } 100% { transform: translateY(0) scaleX(1) scaleY(1); } }
    @keyframes tapBody { 0%,100% { transform: rotate(0deg); } 18% { transform: rotate(-1deg); } 48% { transform: rotate(2deg); } 70% { transform: rotate(-1deg); } }
    @keyframes tapHead { 0%,100% { transform: rotate(0deg); } 18% { transform: rotate(3deg) translateY(2px); } 48% { transform: rotate(-10deg) translateY(-5px); } 70% { transform: rotate(-2deg) translateY(-1px); } }
    @keyframes tapShadow { 0%,100% { transform: scale(1); opacity:.16; } 18% { transform: scaleX(1.12) scaleY(.95); opacity:.2; } 48% { transform: scaleX(.86) scaleY(.82); opacity:.1; } 70% { transform: scaleX(.96) scaleY(.9); opacity:.13; } }
    @keyframes splash { 0% { transform: translate(-50%, -50%) scale(.2); opacity:.9; } 100% { transform: translate(-50%, -50%) scale(2.8); opacity:0; } }
    @keyframes bubbleUp { 0% { transform: translateY(0) scale(.8); opacity:0; } 12% { opacity:.65; } 100% { transform: translateY(-120vh) scale(1.1); opacity:0; } }
    .bubble { position:absolute; bottom:-10vh; width:clamp(8px, 2vw, 16px); aspect-ratio:1; border-radius:50%; border:2px solid rgba(255,255,255,.45); background:rgba(255,255,255,.10); animation:bubbleUp linear infinite; pointer-events:none; }

    .speech-bubble {
      position:absolute; left:48%; top:29%; z-index:5;
      white-space:nowrap; opacity:0; pointer-events:none;
      padding:10px 17px; border:3px solid #172e50; border-radius:24px;
      background:#fff; color:#163c69; font-size:clamp(16px,4.8vw,24px);
      font-weight:900; letter-spacing:-.04em; box-shadow:0 5px 0 rgba(0,0,0,.13);
      transform:translate(-15%,-55%) scale(.68);
    }
    .speech-bubble::after {content:''; position:absolute; left:19px; bottom:-12px; width:16px; height:16px; background:white; border-right:3px solid #172e50; border-bottom:3px solid #172e50; transform:rotate(45deg);}
    .speech-bubble.show { animation:speechPop .95s ease-out both; }
    @keyframes speechPop {
      0% {opacity:0;transform:translate(-15%,-45%) scale(.65) rotate(-5deg);}
      14% {opacity:1;transform:translate(-15%,-64%) scale(1.07) rotate(3deg);}
      29% {opacity:1;transform:translate(-15%,-62%) scale(1) rotate(0);}
      74% {opacity:1;transform:translate(-15%,-70%) scale(1);}
      100% {opacity:0;transform:translate(-15%,-95%) scale(.96);}
    }


    .head-motion .head-layer.hidden {opacity:0;}
    .character img.custom-head {position:absolute;display:none;width:45%;height:auto;left:20%;top:35%;pointer-events:none;transform-origin:50% 50%;object-fit:contain;}
    .character img.custom-head.active {display:block;}
    .character img.custom-head.placing {outline:2px dashed #fff;outline-offset:3px;filter:drop-shadow(0 0 3px #12477c);}
    .face-button {position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 15px);z-index:20;border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.94);color:#12549f;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800;box-shadow:0 5px 16px #0002;cursor:pointer;}
    .edit-backdrop {position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(0,23,57,.8);}
    .edit-backdrop.open {display:flex;}
    .edit-dialog {width:min(100%,510px);max-height:calc(100dvh - 24px);overflow-y:auto;background:#fff;border-radius:19px;padding:15px;color:#193e64;overscroll-behavior:contain;}
    .edit-dialog h2 {margin:0 0 5px;font-size:21px;}
    .edit-dialog p {font-size:12px;line-height:1.5;color:#4c6881;margin:5px 0 10px;}
    .edit-canvas-wrap {width:100%;height:min(55dvh,425px);background:repeating-conic-gradient(#d9e2ec 0 25%,#f4f7fa 0 50%) 50%/18px 18px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;}
    #selectionCanvas {display:block;max-width:100%;max-height:100%;touch-action:none;image-rendering:auto;}
    .edit-tools {display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;}
    .edit-tools label {font-size:13px;font-weight:750;}
    .edit-tools input[type=range] {flex:1;min-width:80px;accent-color:#1673d5;}
    .ui-button,.upload-label {display:inline-block;border:0;background:#e6f0fb;border-radius:10px;color:#185b9a;font-size:13px;font-weight:800;padding:11px 13px;cursor:pointer;}
    .ui-button.primary {color:white;background:#146bd1;}
    .ui-button.selected {background:#185ea7;color:white;}
    .actions {display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
    .actions>* {flex:1;min-width:70px;}
    .placement-panel {position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);z-index:25;display:none;width:min(92%,390px);background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 8px 40px #001e5680;color:#193e64;}
    .placement-panel.open {display:block;}
    .placement-panel p {font-size:13px;font-weight:700;margin:0 0 9px;text-align:center;}
    .placement-panel .edit-tools {margin:5px 0;}
    .status-text {min-height:17px;font-size:12px;color:#9b3a26;}
    .stage.placing {touch-action:none;}


    .creator-credit { position:fixed; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:8; color:rgba(255,255,255,.93); font-size:clamp(10px,2.7vw,13px); font-weight:600; text-align:right; letter-spacing:-.025em; text-shadow:0 1px 5px #003a7c99; max-width:calc(100vw - 24px); }
    .creator-credit a {color:inherit;text-decoration:none;}
    @media (max-width: 600px) { .face-button { top:calc(env(safe-area-inset-top,0px) + 126px); padding:8px 12px; font-size:13px; } }
  </style>
</head>
<body>

  <button type="button" id="faceButton" class="face-button">📷 머리 바꾸기</button>
  <div id="editBackdrop" class="edit-backdrop" role="dialog" aria-modal="true" aria-label="머리 이미지 편집">
    <div class="edit-dialog">
      <h2>머리 이미지 누끼 따기</h2>
      <p>원하는 부분을 초록색 반투명 브러시로 칠해 주세요. 칠한 부분만 남습니다. 뿔까지 포함해도 돼요.</p>
      <label class="upload-label" for="uploadPhoto">📂 이미지 불러오기</label>
      <input id="uploadPhoto" type="file" accept="image/*" hidden />
      <div class="edit-canvas-wrap" id="paintWrap"><canvas id="selectionCanvas" width="500" height="380"></canvas></div>
      <div class="edit-tools"><button class="ui-button selected" id="paintKeep" type="button">🖌️ 남기기</button><button class="ui-button" id="paintErase" type="button">🧽 지우기</button><button class="ui-button" id="clearMask" type="button">선택 지우기</button></div>
      <div class="edit-tools"><label for="brushSize">브러시 <b id="brushSizeLabel">34</b></label><input type="range" id="brushSize" min="4" max="160" value="34" step="1" /></div>
      <div id="editStatus" class="status-text"></div>
      <div class="actions"><button class="ui-button" id="editClose">취소</button><button class="ui-button" id="restoreHead">원래 머리</button><button class="ui-button primary" id="applyMask">누끼 적용 →</button></div>
    </div>
  </div>
  <div class="placement-panel" id="placementPanel">
    <p>사진을 드래그해서 몸에 연결할 위치를 정하세요</p>
    <div class="edit-tools"><label for="headSize">머리 크기</label><input id="headSize" type="range" min="12" max="100" value="45" /><span id="headSizeLabel">45%</span></div>
    <div class="actions"><button class="ui-button" id="placeAgain">다시 누끼 따기</button><button class="ui-button primary" id="placeFinish">위치 확정</button></div>
  </div>
  <div class="wave1"></div>
  <div class="wave2"></div>

  <script>
    const countValue = document.getElementById('countValue');
    const character = document.getElementById('character');
    const tapEffect = document.getElementById('tapEffect');
    const game = document.getElementById('game');
    const bubble = document.getElementById('speechBubble');
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.36;
    bgm.playbackRate = 1.25;
    bgm.preservesPitch = true;
    // A single audio element owns music playback; a fast sequence of taps must
    // never issue competing play requests before the first Promise resolves.
    let musicPending = false;
    let musicStarted = false;
    function startMusic() {
      if (musicPending || musicStarted || !bgm.paused) return;
      musicPending = true;
      bgm.playbackRate = 1.25;
      bgm.preservesPitch = true;
      const result = bgm.play();
      if (result && typeof result.then === 'function') {
        result.then(() => {
          musicStarted = true;
          musicPending = false;
        }).catch(() => {
          // Retry is possible on a later user gesture if playback was blocked.
          musicPending = false;
        });
      } else {
        musicStarted = true;
        musicPending = false;
      }
    }
    // If the browser suspends/pauses audio after a background tab transition,
    // the next tap may safely resume the same element rather than creating another.
    bgm.addEventListener('pause', () => { musicStarted = false; });
    let bubbleTimer = null;
    const lines = ['얏후~~', '끼얏호~~~', '아싸뵹~~', '물만났어~~'];
    function maybeSpeech() {
      if (Math.random() >= 0.40) return;
      if (bubbleTimer !== null) clearTimeout(bubbleTimer);
      bubble.textContent = lines[Math.floor(Math.random()*lines.length)];
      bubble.classList.remove('show'); void bubble.offsetWidth;
      bubble.classList.add('show');
      bubbleTimer = setTimeout(() => { bubble.classList.remove('show'); bubbleTimer=null; },950);
    }
    let count = 0;
    let jumpTimer = null;
    function updateCount() { countValue.textContent = count.toLocaleString('ko-KR'); }
    function playJump() {
      if (jumpTimer !== null) clearTimeout(jumpTimer);
      character.classList.remove('is-jumping');
      void character.offsetWidth;
      character.classList.add('is-jumping');
      jumpTimer = setTimeout(() => {
        character.classList.remove('is-jumping');
        jumpTimer = null;
      }, 500);
    }
    function createSplash(x, y) {
      const splash = document.createElement('div');
      splash.className = 'splash';
      splash.style.left = `${x}px`;
      splash.style.top = `${y}px`;
      tapEffect.appendChild(splash);
      splash.addEventListener('animationend', () => splash.remove(), { once: true });
    }
    function handleTap(event) {
      count += 1;
      updateCount();
      playJump();
      maybeSpeech();
      startMusic();
      const rect = game.getBoundingClientRect();
      createSplash(event.clientX - rect.left, event.clientY - rect.top);
    }
    game.addEventListener('pointerdown', handleTap, { passive: true });
    function spawnBubble() {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.style.left = `${Math.random() * 100}%`;
      bubble.style.animationDuration = `${4 + Math.random() * 5}s`;
      bubble.style.transform = `scale(${0.75 + Math.random() * 0.6})`;
      document.body.appendChild(bubble);
      bubble.addEventListener('animationend', () => bubble.remove(), { once: true });
    }
    for (let i = 0; i < 10; i += 1) setTimeout(spawnBubble, i * 450);
    setInterval(spawnBubble, 900);
    updateCount();

    // 편집 작업은 브라우저의 Canvas와 메모리에서만 이루어집니다. 파일을 네트워크로 보내지 않습니다.
    const faceButton = document.getElementById('faceButton');
    const editBackdrop = document.getElementById('editBackdrop');
    const uploadPhoto = document.getElementById('uploadPhoto');
    const selectionCanvas = document.getElementById('selectionCanvas');
    const pc = selectionCanvas.getContext('2d');
    const editStatus = document.getElementById('editStatus');
    const brushSize = document.getElementById('brushSize');
    const brushSizeLabel = document.getElementById('brushSizeLabel');
    const paintKeep = document.getElementById('paintKeep');
    const paintErase = document.getElementById('paintErase');
    const originalHead = document.getElementById('originalHead');
    const customHead = document.getElementById('customHead');
    const stage = document.getElementById('stage');
    const placementPanel = document.getElementById('placementPanel');
    const headSize = document.getElementById('headSize');
    const headSizeLabel = document.getElementById('headSizeLabel');
    let uploaded = null, sourceCanvas = document.createElement('canvas');
    let maskCanvas = document.createElement('canvas'), maskCtx = maskCanvas.getContext('2d');
    let brushMode = 'keep', painting = false, lastPos = null, placing = false, placeDrag = null;
    function setEditorOpen(open){ editBackdrop.classList.toggle('open', open); if(open) renderEditor(); }
    function blankEditor(){pc.clearRect(0,0,selectionCanvas.width,selectionCanvas.height);pc.fillStyle='#6282a3';pc.font='bold 17px system-ui';pc.textAlign='center';pc.fillText('먼저 이미지를 불러와 주세요',selectionCanvas.width/2,selectionCanvas.height/2);}
    function renderEditor(){
      if(!uploaded){blankEditor();return;}
      pc.clearRect(0,0,selectionCanvas.width,selectionCanvas.height);
      pc.drawImage(sourceCanvas,0,0);
      pc.save(); pc.globalAlpha=.38;
      pc.fillStyle='#38de90';
      pc.drawImage(maskCanvas,0,0);
      pc.restore();
    }
    // Mask pixels store actual green translucent overlay, with alpha representing selection.
    function pointOnCanvas(e){ const r=selectionCanvas.getBoundingClientRect();return {x:(e.clientX-r.left)*selectionCanvas.width/r.width,y:(e.clientY-r.top)*selectionCanvas.height/r.height}; }
    function markStroke(a,b){
      const radius=Number(brushSize.value)/2;
      maskCtx.save();maskCtx.lineCap='round';maskCtx.lineJoin='round';maskCtx.lineWidth=radius*2;
      maskCtx.globalCompositeOperation=brushMode==='keep'?'source-over':'destination-out';
      maskCtx.strokeStyle=brushMode==='keep'?'rgba(0,180,110,1)':'rgba(0,0,0,1)';
      maskCtx.beginPath();maskCtx.moveTo(a.x,a.y);maskCtx.lineTo(b.x,b.y);maskCtx.stroke();
      maskCtx.fillStyle=brushMode==='keep'?'rgba(0,180,110,1)':'rgba(0,0,0,1)';maskCtx.beginPath();maskCtx.arc(b.x,b.y,radius,0,Math.PI*2);maskCtx.fill();maskCtx.restore();renderEditor();
    }
    selectionCanvas.addEventListener('pointerdown',e=>{if(!uploaded)return;e.preventDefault();painting=true;lastPos=pointOnCanvas(e);selectionCanvas.setPointerCapture(e.pointerId);markStroke(lastPos,lastPos);});
    selectionCanvas.addEventListener('pointermove',e=>{if(!painting)return;e.preventDefault();const p=pointOnCanvas(e);markStroke(lastPos,p);lastPos=p;});
    ['pointerup','pointercancel','lostpointercapture'].forEach(n=>selectionCanvas.addEventListener(n,()=>{painting=false;lastPos=null;}));
    function setBrushMode(mode){brushMode=mode;paintKeep.classList.toggle('selected',mode==='keep');paintErase.classList.toggle('selected',mode==='erase');}
    paintKeep.addEventListener('click',()=>setBrushMode('keep'));paintErase.addEventListener('click',()=>setBrushMode('erase'));
    brushSize.addEventListener('input',()=>brushSizeLabel.textContent=brushSize.value);
    document.getElementById('clearMask').addEventListener('click',()=>{maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);renderEditor();});
    [faceButton,editBackdrop,placementPanel].forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));
    faceButton.addEventListener('click',()=>{if(placing){placing=false;placementPanel.classList.remove('open');stage.classList.remove('placing');customHead.classList.remove('placing');}setEditorOpen(true);});
    document.getElementById('editClose').addEventListener('click',()=>setEditorOpen(false));
    uploadPhoto.addEventListener('change',()=>{
      const f=uploadPhoto.files?.[0];if(!f)return;
      if(!f.type.startsWith('image/')){editStatus.textContent='이미지 파일을 선택해 주세요.';return;}
      const url=URL.createObjectURL(f),img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
        sourceCanvas.width=maskCanvas.width=selectionCanvas.width=w;
        sourceCanvas.height=maskCanvas.height=selectionCanvas.height=h;
        sourceCanvas.getContext('2d').drawImage(img,0,0,w,h);
        maskCtx=maskCanvas.getContext('2d');maskCtx.clearRect(0,0,w,h);
        uploaded=img;editStatus.textContent='';setBrushMode('keep');renderEditor();URL.revokeObjectURL(url);
      };
      img.onerror=()=>{editStatus.textContent='이미지를 열 수 없어요.';URL.revokeObjectURL(url);};img.src=url;
      uploadPhoto.value='';
    });
    function enablePlacement(){
      placing=true;placementPanel.classList.add('open');stage.classList.add('placing');customHead.classList.add('placing');
      // Pause idle rocking while selecting a precise connection position.
      character.style.animationPlayState='paused';
    }
    function disablePlacement(){
      placing=false;placementPanel.classList.remove('open');stage.classList.remove('placing');customHead.classList.remove('placing');
      character.style.animationPlayState='';
    }
    document.getElementById('applyMask').addEventListener('click',()=>{
      if(!uploaded){editStatus.textContent='먼저 사진을 불러와 주세요.';return;}
      const w=maskCanvas.width,h=maskCanvas.height,alpha=maskCtx.getImageData(0,0,w,h).data;
      let minX=w,minY=h,maxX=-1,maxY=-1;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){
        const i=(y*w+x)*4;if(alpha[i+3]>3){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);}
      }
      if(maxX<0){editStatus.textContent='초록색 브러시로 남길 부분을 칠해 주세요.';return;}
      const sw=maxX-minX+1,sh=maxY-minY+1;
      const result=document.createElement('canvas');result.width=sw;result.height=sh;
      const rctx=result.getContext('2d');rctx.drawImage(sourceCanvas,minX,minY,sw,sh,0,0,sw,sh);
      const m=document.createElement('canvas');m.width=sw;m.height=sh;
      m.getContext('2d').drawImage(maskCanvas,minX,minY,sw,sh,0,0,sw,sh);
      rctx.globalCompositeOperation='destination-in';rctx.drawImage(m,0,0);
      customHead.src=result.toDataURL('image/png');
      customHead.style.aspectRatio=sw+'/'+sh;
      customHead.style.height='auto';
      originalHead.classList.add('hidden');customHead.classList.add('active');
      customHead.style.width=headSize.value+'%';
      customHead.style.left='15%';customHead.style.top='35%';
      setEditorOpen(false);enablePlacement();
    });
    document.getElementById('restoreHead').addEventListener('click',()=>{
      originalHead.classList.remove('hidden');customHead.classList.remove('active');customHead.src='';disablePlacement();setEditorOpen(false);
    });
    headSize.addEventListener('input',()=>{headSizeLabel.textContent=headSize.value+'%';customHead.style.width=headSize.value+'%';});
    // Position uses the head-motion coordinate space, so the replacement follows head animation.
    stage.addEventListener('pointerdown',e=>{
      if(!placing)return;
      e.stopPropagation();e.preventDefault();
      const motion=character.querySelector('.head-motion');const r=motion.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
      const size=Number(headSize.value), heightPercent=size*(customHead.naturalHeight/customHead.naturalWidth)*(r.width/r.height);
      customHead.style.left=(x-size/2)+'%';customHead.style.top=(y-heightPercent/2)+'%';
      placeDrag=e.pointerId;stage.setPointerCapture(e.pointerId);
    },true);
    stage.addEventListener('pointermove',e=>{
      if(!placing || placeDrag!==e.pointerId)return;e.preventDefault();
      const motion=character.querySelector('.head-motion');const r=motion.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
      const size=Number(headSize.value),heightPercent=size*(customHead.naturalHeight/customHead.naturalWidth)*(r.width/r.height);
      customHead.style.left=(x-size/2)+'%';customHead.style.top=(y-heightPercent/2)+'%';
    },true);
    ['pointerup','pointercancel'].forEach(n=>stage.addEventListener(n,()=>placeDrag=null,true));
    document.getElementById('placeFinish').addEventListener('click',disablePlacement);
    document.getElementById('placeAgain').addEventListener('click',()=>{disablePlacement();setEditorOpen(true);});
    // Prevent tap score or music triggers when the editor or placement is active.
    game.removeEventListener('pointerdown',handleTap);
    game.addEventListener('pointerdown',e=>{if(!placing)handleTap(e);},{passive:true});
    blankEditor();

  </script>
</body>
</html>
